name: Build CKPool image

on:
  push:
    branches:
      - main
    paths:
      - "qbitleap-solo-miner/ckpool/**"
      - ".github/workflows/build-ckpool.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./qbitleap-solo-miner/ckpool
          file: ./qbitleap-solo-miner/ckpool/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/qbitleap/qbitleap-ckpool:0.1.0
