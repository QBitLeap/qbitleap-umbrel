name: Build Qbit Solo dashboard image

on:
  push:
    branches:
      - main
      - "release/**"
    paths:
      - "qbitleap-solo-miner/backend/**"
      - "qbitleap-solo-miner/scripts/**"
      - "qbitleap-solo-miner/umbrel-app.yml"
      - ".github/workflows/build-backend.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Load app version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: "\([^"]*\)"$/\1/p' qbitleap-solo-miner/umbrel-app.yml)"
          test -n "${version}"
          printf 'APP_VERSION=%s\n' "${version}" >> "${GITHUB_ENV}"

      - name: Test dashboard
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r qbitleap-solo-miner/backend/requirements.txt
          python3 -m py_compile qbitleap-solo-miner/backend/*.py
          PYTHONPATH=qbitleap-solo-miner/backend \
            python3 -m unittest -v qbitleap-solo-miner/backend/test_permissionless_telemetry.py
          PYTHONPATH=qbitleap-solo-miner/backend \
            python3 -m unittest -v qbitleap-solo-miner/backend/test_dashboard.py
          python3 -m unittest -v qbitleap-solo-miner/test_compose_contract.py

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish backend
        uses: docker/build-push-action@v7
        with:
          context: ./qbitleap-solo-miner
          file: ./qbitleap-solo-miner/backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/qbitleap/qbit-solo-dashboard:${{ env.APP_VERSION }}
            ghcr.io/qbitleap/qbit-solo-dashboard:latest
