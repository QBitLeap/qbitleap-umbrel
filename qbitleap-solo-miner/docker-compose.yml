version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: qbitleap-solo-miner_dashboard_1
      APP_PORT: 8000

  config-init:
    image: ghcr.io/qbitleap/qbitleap-backend:0.1.4
    command: ["/usr/local/bin/init-qbit-config.sh"]
    restart: "no"
    volumes:
      - ${APP_DATA_DIR}/data/config:/config

  dashboard:
    image: ghcr.io/qbitleap/qbitleap-backend:0.1.4
    restart: on-failure
    depends_on:
      config-init:
        condition: service_completed_successfully
      qbitd:
        condition: service_started
      ckpool:
        condition: service_started
    environment:
      QBIT_RPC_HOST: qbitd
      QBIT_RPC_PORT: 8352
      CKPOOL_SOCKET_PATH: /ckpool-sock/qbitlab/stratifier
      CKPOOL_STATUS_PATH: /ckpool-logs/pool/pool.status
      CKPOOL_STRATUM_HOST: ckpool
      CKPOOL_STRATUM_PORT: "3333"
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${APP_DATA_DIR}/data/ckpool/logs:/ckpool-logs:ro
      - ${APP_DATA_DIR}/data/ckpool/sock:/ckpool-sock:ro

  qbitd:
    image: ghcr.io/qbitleap/qbitleap-qbit-core:0.1.0
    restart: on-failure
    depends_on:
      config-init:
        condition: service_completed_successfully
    volumes:
      - ${APP_DATA_DIR}/data/qbit:/data
      - ${APP_DATA_DIR}/data/config:/config:ro
    command:
      - -datadir=/data
      - -conf=/config/qbit.conf

  ckpool:
    image: ghcr.io/qbitleap/qbitleap-ckpool:0.1.0
    restart: on-failure
    depends_on:
      config-init:
        condition: service_completed_successfully
      qbitd:
        condition: service_started
    environment:
      QBIT_CHAIN: mainnet
      QBIT_EXPECTED_GENESIS_HASH: "0000000000004d60aa5d46013991d0a0e2995d89ee98e53068ae196d763e79f2"
      CKPOOL_MINDIFF: "1024"
      CKPOOL_STARTDIFF: "65536"
      CKPOOL_STRATUM_PORT: "3333"
      CKPOOL_LOG_DIR: /var/log/ckpool
      CKPOOL_SOCK_DIR: /tmp/qbitlab
    ports:
      - "3333:3333"
    healthcheck:
      test:
        - CMD-SHELL
        - bash -lc 'exec 3<>/dev/tcp/127.0.0.1/3333'
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - ${APP_DATA_DIR}/data/config:/config:ro
      - ${APP_DATA_DIR}/data/ckpool/logs:/var/log/ckpool
      - ${APP_DATA_DIR}/data/ckpool/sock:/tmp/qbitlab
