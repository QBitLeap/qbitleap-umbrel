version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: qbitleap-solo-miner_dashboard_1
      APP_PORT: 8000

  config-init:
    image: ghcr.io/qbitleap/qbitleap-backend:0.1.2
    command: ["/usr/local/bin/init-qbit-config.sh"]
    restart: "no"
    volumes:
      - ${APP_DATA_DIR}/data/config:/config

  dashboard:
    image: ghcr.io/qbitleap/qbitleap-backend:0.1.2
    restart: on-failure
    depends_on:
      config-init:
        condition: service_completed_successfully
      qbitd:
        condition: service_started
    environment:
      QBIT_RPC_HOST: qbitd
      QBIT_RPC_PORT: 8352
    volumes:
      - ${APP_DATA_DIR}/data/config:/config

  qbitd:
    image: ghcr.io/qbitleap/qbitleap-qbit-core:0.1.0
    restart: on-failure
    depends_on:
      config-init:
        condition: service_completed_successfully
    volumes:
      - ${APP_DATA_DIR}/data/qbit:/data
      - ${APP_DATA_DIR}/data/config:/config:ro
    command:
      - -datadir=/data
      - -conf=/config/qbit.conf

  ckpool:
    image: ghcr.io/qbitleap/qbitleap-ckpool:0.1.0
    restart: on-failure
    depends_on:
      config-init:
        condition: service_completed_successfully
      qbitd:
        condition: service_started
    environment:
      QBIT_CHAIN: mainnet
      QBIT_EXPECTED_GENESIS_HASH: "0000000000004d60aa5d46013991d0a0e2995d89ee98e53068ae196d763e79f2"
      CKPOOL_MINDIFF: "1024"
      CKPOOL_STARTDIFF: "65536"
    volumes:
      - ${APP_DATA_DIR}/data/config:/config:ro
