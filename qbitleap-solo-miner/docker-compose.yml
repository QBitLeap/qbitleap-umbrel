version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: qbitleap-solo-miner_dashboard_1
      APP_PORT: 8000

  dashboard:
    image: ghcr.io/qbitleap/qbitleap-backend:0.1.1
    restart: on-failure
    depends_on:
      - qbitd

  qbitd:
    image: alpine:3.22
    container_name: qbitleap-qbitd
    command: ["sleep", "infinity"]
    restart: on-failure
